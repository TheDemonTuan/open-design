name: OpenDesign deployment operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Status, rollback to approved previous digest, or explicit recovery
        required: true
        type: choice
        options: [status, rollback, reconcile]

permissions:
  contents: read

jobs:
  operate:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: TheDemonTuan/vps-deploy/.github/actions/deploy@806225b42ac720fb9e1af49beb3b2a073563557c
        with:
          app: opendesign
          host: oracle-main
          operation: ${{ inputs.operation }}
          component: app
          source-sha: ${{ github.sha }}
          platform-ref: 806225b42ac720fb9e1af49beb3b2a073563557c
          config: .deploy/app.yml
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
